<!DOCTYPE html>
<html lang="en">
  <body style="margin:0; padding:0; background:#f4ebdf; font-family:Arial, Helvetica, sans-serif; color:#2E1D18;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4ebdf; padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:620px; background:#1d120d; border-radius:18px; overflow:hidden; border:1px solid #d7ad64;">
            <tr>
              <td style="background:linear-gradient(135deg,#2d1b13,#120d0b); padding:24px 28px; color:#f3d19d; text-align:left;">
                <div style="font-size:12px; letter-spacing:2px; text-transform:uppercase; font-weight:700;">Coffee Invite</div>
                <div style="font-size:32px; font-weight:700; margin-top:8px;">☕ Tejashri said YES!</div>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 28px; background:#fffaf5;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fffdfb; border:1px solid #e8d9bb; border-radius:16px;">
                  <tr>
                    <td style="padding:20px;">
                      <div style="font-size:13px; text-transform:uppercase; letter-spacing:1.8px; color:#7a5b3a; font-weight:700;">Plan details</div>
                      <div style="font-size:36px; font-weight:700; color:#2c1d15; margin-top:8px;">{{date}}</div>
                      <div style="font-size:20px; color:#5d3a2d; margin-top:8px;">{{time}}</div>
                    </td>
                  </tr>
                </table>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:18px; background:#fffdfb; border:1px solid #e8d9bb; border-radius:16px;">
                  <tr>
                    <td style="padding:18px 20px; color:#2E1D18;">
                      <div style="margin-bottom:10px;"><strong>Vibe:</strong> {{vibe}}</div>
                      <div style="margin-bottom:10px;"><strong>Place:</strong> {{place}}</div>
                      <div style="margin-bottom:10px;"><strong>Weather:</strong> {{weather}}</div>
                      <div style="margin-bottom:10px;"><strong>Note:</strong> {{note}}</div>
                      <div style="margin-top:14px;">
                        <a href="{{maps_link}}" style="display:inline-block; background:#d7ad64; color:#1d120d; text-decoration:none; padding:12px 18px; border-radius:999px; font-weight:700;">Open in Maps</a>
                        <a href="{{whatsapp_link}}" style="display:inline-block; background:#25D366; color:#ffffff; text-decoration:none; padding:12px 18px; border-radius:999px; font-weight:700; margin-left:8px;">Reply on WhatsApp</a>
                      </div>
                    </td>
                  </tr>
                </table>

                <div style="margin-top:20px; color:#62493a; font-size:13px;">
                  Sent: {{sent_at}}
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
